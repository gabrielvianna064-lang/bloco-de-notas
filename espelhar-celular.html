<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Espelho de Tela 2</title>

<style>
body{
    background:#111;
    color:#fff;
    text-align:center;
    font-family:Arial, sans-serif;
}

video{
    width:90%;
    max-width:600px;
    border-radius:15px;
    border:3px solid #00ff88;
}

button{
    padding:15px 25px;
    background:#00aa55;
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#008844;
}
</style>

</head>

<body>

<h1>Espelhamento da Tela 2</h1>

<button id="btn">
Compartilhar Tela
</button>

<br><br>

<video id="tela" autoplay playsinline muted></video>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getDatabase,
    ref,
    set,
    push,
    onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    databaseURL: "https://pemissao--concedido-ou-negado-default-rtdb.europe-west1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const video = document.getElementById("tela");
const botao = document.getElementById("btn");

const pc = new RTCPeerConnection({
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        }
    ]
});

// Estado da conexão
pc.onconnectionstatechange = () => {
    console.log("Estado:", pc.connectionState);
};

// Recebe resposta
onValue(ref(db, "espelho2/resposta"), async (snapshot) => {

    if (!snapshot.exists()) return;

    try {

        if (!pc.currentRemoteDescription) {

            await pc.setRemoteDescription(snapshot.val());

            console.log("Resposta conectada");

        }

    } catch (e) {

        console.log("Erro resposta:", e);

    }

});

// Envia candidatos
pc.onicecandidate = (event) => {

    if (!event.candidate) return;

    push(
        ref(db, "espelho2/candidatos"),
        event.candidate.toJSON()
    );

    console.log("Candidato enviado");

};

// Compartilhar tela
botao.onclick = async () => {

    try {

        console.log("Abrindo compartilhamento...");

        const stream = await navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: true
        });

        video.srcObject = stream;

        stream.getTracks().forEach(track => {
            pc.addTrack(track, stream);
        });

        stream.getVideoTracks()[0].onended = () => {

            console.log("Compartilhamento encerrado");

            video.srcObject = null;

        };

        const oferta = await pc.createOffer();

        await pc.setLocalDescription(oferta);

        await set(ref(db, "espelho2/oferta"), {
            type: pc.localDescription.type,
            sdp: pc.localDescription.sdp
        });

        console.log("Oferta enviada");

        alert("Tela compartilhada!");

    } catch (e) {

        console.log(e);

        alert("Erro: " + e.message);

    }

};

// Recebe candidatos do visualizador
onValue(ref(db, "espelho2/candidatos_pc"), (snapshot) => {

    snapshot.forEach(async (item) => {

        try {

            await pc.addIceCandidate(item.val());

            console.log("Candidato recebido");

        } catch (e) {

            console.log("Erro ICE:", e);

        }

    });

});

</script>
